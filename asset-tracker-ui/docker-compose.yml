services:
  postgres-db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        RUN echo "host replication postgres 172.25.0.0/16 trust" >> /usr/local/share/postgresql/pg_hba.conf.sample
    container_name: asset-postgres
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on
    ports:
      - "5433:5432"
    networks:
      asset-network:
        ipv4_address: 172.25.0.10

  postgres-replica:
    image: postgres:16-alpine
    container_name: asset-postgres-replica
    environment:
      POSTGRES_PASSWORD: SecretPassword123
    ports:
      - "5435:5432" 
    depends_on:
      - postgres-db
    networks:
      asset-network:
        ipv4_address: 172.25.0.20
    entrypoint: |
      /bin/sh -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo '🔄 Wiping clean and cloning master data...'
        rm -rf /var/lib/postgresql/data/*
        until pg_basebackup -h 172.25.0.10 -p 5432 -D /var/lib/postgresql/data -U postgres -v -P -R -X stream; do
          echo '⏳ Waiting for master database to come online...'
          sleep 2
        done
        echo '✅ Clone complete. Repairing file permissions...'
        chown -R postgres:postgres /var/lib/postgresql/data
        # 👈 FIXED: Restricts data directory rights strictly to user-only access as required by Postgres
        chmod 700 /var/lib/postgresql/data
      fi
      exec su-exec postgres postgres
      "

  mongo-db:
    image: mongo:7.0
    container_name: compliance-mongo
    environment:
      MONGO_INITDB_DATABASE: compliance_audit
      MONGO_INITDB_ROOT_USERNAME: root_admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPassword123
    ports:
      - "27018:27017"
    networks:
      asset-network:
        ipv4_address: 172.25.0.30

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    networks:
      asset-network:
        ipv4_address: 172.25.0.40

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_iam
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://172.25.0.40:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      asset-network:
        ipv4_address: 172.25.0.50
        
  consul:
    image: hashicorp/consul:1.15.4
    container_name: consul_registry
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - asset-network # Ensure this matches your existing static network name

networks:
  asset-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
