services:
  postgres-db:
    # 💡 UPDATED: Swapped to a verified, active Spilo 16 registry image tag
    image: ghcr.io/zalando/spilo-16:3.3-p3
    container_name: asset-postgres
    ports:
      - "5433:5432"
    environment:
      # 1. Cluster Information
      PATRONI_SCOPE: asset_management_cluster
      PATRONI_NAME: postgres-primary
      
      # 2. Consul DCS Configuration
      PATRONI_DCS_PROVIDER: consul
      PATRONI_CONSUL_HOST: consul_registry:8500
      
      # 3. Network and Security Settings
      PATRONI_POSTGRESQL_LISTEN: '0.0.0.0:5432'
      PATRONI_POSTGRESQL_DATA_DIR: '/home/postgres/pgdata'
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: SecretPassword123
      
      # Bootstrap configuration parameters
      PATRONI_BOOTSTRAP_DCS: |
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
    networks:
      asset-network:
        ipv4_address: 172.25.0.10
    depends_on:
      - consul

  mongo-db:
    image: mongo:7.0
    container_name: compliance-mongo
    environment:
      MONGO_INITDB_DATABASE: compliance_audit
      MONGO_INITDB_ROOT_USERNAME: root_admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPassword123
    ports:
      - "27018:27017"
    networks:
      asset-network:
        ipv4_address: 172.25.0.30

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    networks:
      asset-network:
        ipv4_address: 172.25.0.40

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_iam
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://172.25.0.40:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      asset-network:
        ipv4_address: 172.25.0.50

  consul:
    image: hashicorp/consul:1.15.4
    container_name: consul_registry
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - asset-network # Ensure this matches your existing static network name

networks:
  asset-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
