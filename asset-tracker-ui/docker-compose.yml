services:
  postgres-db:
    image: postgres:16-alpine
    container_name: asset-postgres
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123
    ports:
      - "5433:5432"
    networks:
      - asset-network

  mongo-db:
    image: mongo:7.0
    container_name: compliance-mongo
    environment:
      MONGO_INITDB_DATABASE: compliance_audit
      MONGO_INITDB_ROOT_USERNAME: root_admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPassword123
    ports:
      - "27018:27017"
    networks:
      - asset-network

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    networks:
      - asset-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak_iam
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      - asset-network

networks:
  asset-network:
    driver: bridge

